name: API endpoint chains weekly check
# API-1081. src/api-endpoints.json vendors, for each endpoint the CLI calls, the
# chains it accepts and its request fields, from the public OpenAPI spec. The
# CLI rejects an unsupported --chain before it sends a request, so a chain the
# API adds is refused until the file is refreshed (npm run endpoints:sync).
# This job compares the file with the live spec and opens one tracking issue,
# commenting again only when the drift changes.
# Exit 0 = in sync, 3 = drift, other = the check failed.

on:
  schedule:
    - cron: '41 6 * * 1' # Mondays 06:41 UTC
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The script uses node built-ins and fetch only, so no npm ci is needed.
      - name: Run the check
        id: run
        run: |
          set +e
          node scripts/sync-api-endpoints.js --check > report.txt
          status=$?
          cat report.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then exit 1; fi
          exit 0

      - name: Open or update the tracking issue
        if: steps.run.outputs.status == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: API endpoint chains are out of sync with the API spec
          KEY_LINE: '- /api/'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo 'src/api-endpoints.json differs from https://api.nansen.ai/openapi.json.'
            echo
            echo '```text'
            cat report.txt
            echo '```'
            echo
            echo 'Run `npm run endpoints:sync`, review the diff, and commit it. See AGENTS.md > Input validation and errors.'
            echo
            echo "Run: $RUN_URL"
          } > issue-body.md
          # Exact title match: the search is fuzzy.
          existing=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$TITLE" --body-file issue-body.md
            exit 0
          fi
          # Comment only when the key lines of the report are new.
          seen=$(gh issue view "$existing" --json body,comments --jq '[.body, .comments[].body] | join("\n")')
          # KEY_LINE is a fixed string, not a regex (grep -F).
          new_lines=$(grep -F -- "$KEY_LINE" report.txt | while IFS= read -r line; do
            printf '%s\n' "$seen" | grep -qxF "$line" || printf '%s\n' "$line"
          done)
          if [ -n "$new_lines" ]; then
            gh issue comment "$existing" --body-file issue-body.md
          else
            echo "Issue #$existing already has this report."
          fi
